<!doctype html><html lang="fr"><meta charset="utf-8"><title>Test SAM 2</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:12px}#area{position:relative;max-width:650px}img{width:100%;display:block}canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}button{margin:6px;padding:10px}.active{background:#b9e7ff}</style><h1>Tester les plis de la main avec SAM 2</h1><p>Choisis une photo, clique sur un pli avec le bouton vert, puis sur la peau autour avec le bouton rouge.</p><input type="file" id="file" accept="image/*"><p><button id="pos" class="active">Point sur le pli (vert)</button><button id="neg">Point hors du pli (rouge)</button><button id="undo">Annuler un point</button><button id="reset">Effacer</button><button id="test">Tester SAM 2</button></p><p id="message">Choisis une photographie.</p><div id="area"><img id="photo"><canvas id="canvas"></canvas></div><script>
const file=document.querySelector('#file'),img=document.querySelector('#photo'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),message=document.querySelector('#message');let mode='positive',pts=[],result=null,objectUrl=null;
function paint(){if(!img.naturalWidth)return;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.clearRect(0,0,canvas.width,canvas.height);if(result)ctx.drawImage(result,0,0,canvas.width,canvas.height);for(const p of pts){ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(5,canvas.width/130),0,Math.PI*2);ctx.fillStyle=p.mode==='positive'?'#00dc70':'#f44';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke()}}
img.onload=paint;file.onchange=()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);if(!file.files[0])return;objectUrl=URL.createObjectURL(file.files[0]);img.src=objectUrl;pts=[];result=null;message.textContent='Clique sur un pli de la paume.'};
function setMode(m){mode=m;document.querySelector('#pos').classList.toggle('active',m==='positive');document.querySelector('#neg').classList.toggle('active',m==='negative')}
document.querySelector('#pos').onclick=()=>setMode('positive');document.querySelector('#neg').onclick=()=>setMode('negative');
canvas.onclick=e=>{if(!img.naturalWidth)return;const r=canvas.getBoundingClientRect();pts.push({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,mode});result=null;paint()};
document.querySelector('#undo').onclick=()=>{pts.pop();result=null;paint()};document.querySelector('#reset').onclick=()=>{pts=[];result=null;paint()};
document.querySelector('#test').onclick=async()=>{if(!file.files[0]||!pts.some(p=>p.mode==='positive')){message.textContent='Choisis une photo et place au moins un point vert.';return}message.textContent='Analyse en cours…';const data=new FormData();data.append('photo',file.files[0]);data.append('points',JSON.stringify({positive:pts.filter(p=>p.mode==='positive').map(p=>[p.x,p.y]),negative:pts.filter(p=>p.mode==='negative').map(p=>[p.x,p.y])}));try{const r=await fetch('/sam2/preview',{method:'POST',body:data});if(!r.ok)throw Error('Erreur '+r.status+': '+(await r.text()).slice(0,300));const url=URL.createObjectURL(await r.blob()),next=new Image();next.onload=()=>{result=next;paint();URL.revokeObjectURL(url);message.textContent='Résultat en bleu : vérifie si le pli est isolé.'};next.src=url}catch(e){message.textContent=String(e)}};
</script></html>
